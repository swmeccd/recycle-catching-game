<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Green Memory</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; touch-action:manipulation; }
html, body { width:100%; height:100%; overflow:hidden; background:#0d2b1f; font-family:'Segoe UI', Arial, sans-serif; }

/* ---- HUD ---- */
#hud {
  display:flex; justify-content:space-between; align-items:center;
  padding:12px 28px; background:rgba(0,0,0,0.35); color:#fff;
  font-size:20px; font-weight:bold; flex-shrink:0;
}
#livesDisplay { letter-spacing:4px; font-size:26px; }
#timerBarWrap  { width:100%; height:7px; background:rgba(255,255,255,0.15); flex-shrink:0; }
#timerBar      { height:100%; width:100%; background:#2e9e5b; transition:width 0.25s linear, background 0.5s; }

/* ---- Card grid ---- */
#gameContainer { width:100%; height:100%; display:flex; flex-direction:column; }
#board {
  flex:1; display:grid;
  grid-template-columns:repeat(8, 1fr);
  gap:6px; padding:16px 28px;
  align-items:center; justify-items:center;
}

/* ---- Card flip (CSS 3D) ---- */
.card {
  width:100%; max-width:180px;
  aspect-ratio:2/3; perspective:900px; cursor:pointer;
}
.card-inner {
  width:100%; height:100%; position:relative;
  transform-style:preserve-3d;
  transition:transform 0.45s cubic-bezier(0.4,0,0.2,1);
  border-radius:16px;
}
.card.flipped .card-inner,
.card.matched .card-inner { transform:rotateY(180deg); }

.card-face {
  position:absolute; inset:0;
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border-radius:16px; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 5px 20px rgba(0,0,0,0.45);
}
.card-back-face  { background:#1f7a43; border:3px solid #2e9e5b; }
.card-front-face { background:#eaf7ef; border:3px solid #a8f0c6; transform:rotateY(180deg); font-size:52px; }

.card-back-face img,
.card-front-face img { width:100%; height:100%; object-fit:contain; padding:10px; }
.card-back-face .back-emoji { font-size:46px; }

/* matched: green glow */
.card.matched .card-front-face {
  border-color:#2e9e5b; background:#d0f7e0;
  box-shadow:0 0 22px #2e9e5b, 0 5px 20px rgba(0,0,0,0.35);
}
/* mismatch: red tint + shake */
@keyframes shake {
  0%,100%{ transform:rotateY(180deg) translateX(0) }
  20%     { transform:rotateY(180deg) translateX(-9px) }
  40%     { transform:rotateY(180deg) translateX(9px) }
  60%     { transform:rotateY(180deg) translateX(-5px) }
  80%     { transform:rotateY(180deg) translateX(5px) }
}
.card.mismatch .card-inner     { animation:shake 0.45s ease; }
.card.mismatch .card-front-face { border-color:#d9534f; background:#fdecea; }

/* ---- Overlay (start / end screens) ---- */
#overlay {
  position:fixed; inset:0; background:rgba(13,43,31,0.93);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:#fff; text-align:center; padding:24px; z-index:100;
}
#overlay h1  { font-size:46px; margin-bottom:10px; }
#overlay p   { font-size:19px; margin-bottom:28px; opacity:0.9; max-width:500px; line-height:1.7; }
#overlay button {
  background:#2e9e5b; color:#fff; border:none; padding:16px 46px;
  font-size:20px; font-weight:bold; border-radius:50px; cursor:pointer;
  box-shadow:0 4px 0 #1f7a43;
}
#overlay button:active { transform:translateY(2px); box-shadow:0 2px 0 #1f7a43; }
.hidden { display:none !important; }
#finalScore  { font-size:68px; font-weight:bold; color:#a8f0c6; margin-bottom:4px; }
#scoreLabel  { font-size:17px; opacity:0.7; margin-bottom:18px; }

/* leaderboard button — ghost style */
.lb-btn {
  background:transparent; border:2px solid rgba(255,255,255,0.35); color:rgba(255,255,255,0.75);
  padding:10px 28px; font-size:16px; border-radius:50px; cursor:pointer; margin-top:12px;
  box-shadow:none;
}
.lb-btn:active { opacity:0.6; }

/* name entry input */
#nameInput {
  font-size:22px; padding:12px 20px; border-radius:12px;
  border:2px solid #2e9e5b; background:rgba(255,255,255,0.1);
  color:#fff; text-align:center; width:280px; margin-bottom:16px; outline:none;
}
#nameInput::placeholder { color:rgba(255,255,255,0.35); }

/* leaderboard table */
.lb-table { width:100%; max-width:420px; border-collapse:collapse; margin:10px 0 20px; }
.lb-table th { color:#a8f0c6; font-size:13px; padding:6px 12px; text-align:left; border-bottom:1px solid rgba(255,255,255,0.2); }
.lb-table td { padding:8px 12px; font-size:18px; border-bottom:1px solid rgba(255,255,255,0.07); }
.lb-table td:last-child { text-align:right; }
.lb-rank { color:rgba(255,255,255,0.35); font-size:13px; width:28px; }
.lb-table tr.highlight td { color:#a8f0c6; font-weight:bold; }
</style>
</head>
<body>

<div id="gameContainer">
  <div id="hud">
    <div id="scoreDisplay">Matched: 0 / 8</div>
    <div id="livesDisplay">❤️❤️❤️❤️❤️</div>
    <div id="timeDisplay">1:00</div>
  </div>
  <div id="timerBarWrap"><div id="timerBar"></div></div>
  <div id="board"></div>
</div>

<div id="overlay">
  <h1>🌿 Green Memory</h1>
  <p>Flip cards to find matching pairs.<br>
     One wrong match = one life lost ❤️<br>
     Match all 8 pairs before the minute is up!</p>
  <button id="startBtn">Start Game</button>
  <button class="lb-btn" id="lbBtn">🏆 Leaderboard</button>
</div>

<script>
(function(){

// ============================================================
//  CARD FRONT IMAGES
//  Put your PNG files in the SAME FOLDER as this HTML file.
//  Each entry becomes one pair of cards (so 8 entries = 16 cards).
//  'emoji' is the fallback shown if the image hasn't loaded yet.
// ============================================================
const CARD_PAIRS = [
  { id:0, img:'card-bottle.png',  emoji:'🍶' },
  { id:1, img:'card-paper.png',   emoji:'📄' },
  { id:2, img:'card-can.png',     emoji:'🥫' },
  { id:3, img:'card-leaf.png',    emoji:'🌿' },
  { id:4, img:'card-bulb.png',    emoji:'💡' },
  { id:5, img:'card-globe.png',   emoji:'🌍' },
  { id:6, img:'card-compost.png', emoji:'🪣' },
  { id:7, img:'card-solar.png',   emoji:'☀️' },
];

// ============================================================
//  CARD BACK IMAGE
//  Shown when a card is face-down (all cards share one back).
//  Replace the filename, or leave as '' for the plain green default.
// ============================================================
const CARD_BACK_IMG = 'backcard.png'; // e.g. 'card-back.png'

// ============================================================
//  SOUND EFFECTS
//  By default the game generates simple tones so no files are needed.
//  To use your own audio files, replace each function body like this:
//
//    function sfxFlip()  { new Audio('sfx-flip.mp3').play().catch(()=>{}); }
//    function sfxMatch() { new Audio('sfx-match.mp3').play().catch(()=>{}); }
//    function sfxFail()  { new Audio('sfx-fail.mp3').play().catch(()=>{}); }
//    function sfxWin()   { new Audio('sfx-win.mp3').play().catch(()=>{}); }
//    function sfxLose()  { new Audio('sfx-lose.mp3').play().catch(()=>{}); }
//
// ============================================================
//  BACKGROUND MUSIC
//  Uncomment these three lines and fill in your file path.
//  Then uncomment bgMusic.play() in startGame() and bgMusic.pause() in endGame().
//
//    const bgMusic = new Audio('bg-music.mp3');
//    bgMusic.loop   = true;
//    bgMusic.volume = 0.35;
//
// ============================================================
let _audioCtx = null;
function _ac(){ return _audioCtx || (_audioCtx = new(window.AudioContext||window.webkitAudioContext)()); }
function _tone(freq, type='sine', dur=0.12, vol=0.22, delay=0){
  try{
    const ctx=_ac(), o=ctx.createOscillator(), g=ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type=type; o.frequency.setValueAtTime(freq, ctx.currentTime+delay);
    g.gain.setValueAtTime(vol, ctx.currentTime+delay);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+delay+dur);
    o.start(ctx.currentTime+delay); o.stop(ctx.currentTime+delay+dur+0.05);
  }catch(e){}
}
function sfxFlip()  { _tone(520, 'sine', 0.08, 0.15); }
function sfxMatch() { _tone(660,'sine',0.15,0.22); _tone(880,'sine',0.18,0.2,0.13); }
function sfxFail()  { _tone(200,'sawtooth',0.28,0.22); }
function sfxWin()   { [523,659,784,1047].forEach((f,i)=>_tone(f,'sine',0.22,0.22,i*0.13)); }
function sfxLose()  { _tone(160,'sawtooth',0.55,0.28); }

// ============================================================
//  GAME SETTINGS — tweak these if needed
// ============================================================
const GAME_DURATION = 60; // seconds
const MAX_LIVES     = 5;
const TOTAL_PAIRS   = CARD_PAIRS.length; // 8 pairs = 16 cards

// ---- DOM refs ----
const overlay      = document.getElementById('overlay');
const board        = document.getElementById('board');
const scoreDisplay = document.getElementById('scoreDisplay');
const livesDisplay = document.getElementById('livesDisplay');
const timeDisplay  = document.getElementById('timeDisplay');
const timerBar     = document.getElementById('timerBar');
const startBtn     = document.getElementById('startBtn');

// ---- Game state ----
let cards, flipped, matched, lives, timeLeft, timerInterval, locked;

// ---- Helpers ----
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function buildDeck(){
  const deck = [];
  CARD_PAIRS.forEach(pair=>{
    deck.push({...pair, uid:pair.id+'a'});
    deck.push({...pair, uid:pair.id+'b'});
  });
  return shuffle(deck);
}

function updateHUD(){
  scoreDisplay.textContent = `Matched: ${matched} / ${TOTAL_PAIRS}`;
  let hearts = '';
  for(let i=0;i<MAX_LIVES;i++) hearts += (i < lives ? '❤️' : '🖤');
  livesDisplay.textContent = hearts;
  const pct = (timeLeft / GAME_DURATION) * 100;
  timerBar.style.width = pct + '%';
  timerBar.style.background = timeLeft <= 10 ? '#d9534f' : timeLeft <= 20 ? '#e0a83e' : '#2e9e5b';
  const m = Math.floor(timeLeft / 60);
  const s = timeLeft % 60;
  timeDisplay.textContent = m + ':' + String(s).padStart(2,'0');
}

function renderBoard(){
  board.innerHTML = '';
  cards.forEach(card => {
    const el = document.createElement('div');
    el.className = 'card';
    el.dataset.uid = card.uid;
    el.dataset.id  = card.id;

    const inner = document.createElement('div');
    inner.className = 'card-inner';

    // --- Back face ---
    const backFace = document.createElement('div');
    backFace.className = 'card-face card-back-face';
    if(CARD_BACK_IMG){
      const img = document.createElement('img');
      img.src = CARD_BACK_IMG; img.alt = 'card back';
      backFace.appendChild(img);
    } else {
      const em = document.createElement('span');
      em.className = 'back-emoji'; em.textContent = '♻️';
      backFace.appendChild(em);
    }

    // --- Front face ---
    const frontFace = document.createElement('div');
    frontFace.className = 'card-face card-front-face';
    frontFace.textContent = card.emoji; // show emoji immediately as fallback
    const img = new Image();
    img.src = card.img; img.alt = card.emoji;
    img.onload = () => { frontFace.textContent = ''; frontFace.appendChild(img); };

    inner.appendChild(backFace);
    inner.appendChild(frontFace);
    el.appendChild(inner);

    el.addEventListener('click', () => onCardClick(el));
    el.addEventListener('touchend', e => { e.preventDefault(); onCardClick(el); });
    board.appendChild(el);
  });
}

function onCardClick(el){
  if(locked) return;
  if(el.classList.contains('flipped') || el.classList.contains('matched')) return;
  if(flipped.length >= 2) return;

  sfxFlip();
  el.classList.add('flipped');
  flipped.push(el);
  if(flipped.length === 2) checkMatch();
}

function checkMatch(){
  locked = true;
  const [a, b] = flipped;
  const isMatch = a.dataset.id === b.dataset.id;

  if(isMatch){
    sfxMatch();
    matched++;
    a.classList.add('matched');
    b.classList.add('matched');
    flipped = [];
    locked  = false;
    updateHUD();
    if(matched === TOTAL_PAIRS){
      clearInterval(timerInterval);
      endGame(true);
    }
  } else {
    sfxFail();
    lives--;
    a.classList.add('mismatch');
    b.classList.add('mismatch');
    updateHUD();
    setTimeout(()=>{
      a.classList.remove('flipped','mismatch');
      b.classList.remove('flipped','mismatch');
      flipped = [];
      locked  = false;
      if(lives <= 0){ clearInterval(timerInterval); endGame(false); }
    }, 900);
  }
}

function startTimer(){
  clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    timeLeft--;
    updateHUD();
    if(timeLeft <= 0){ clearInterval(timerInterval); endGame(false); }
  }, 1000);
}

// ---- Leaderboard ----
const LB_KEY = 'green-memory-lb';
const LB_MAX = 10;

function loadLB(){ try{ return JSON.parse(localStorage.getItem(LB_KEY))||[]; }catch(e){ return []; } }
function saveLB(lb){ localStorage.setItem(LB_KEY, JSON.stringify(lb)); }

function addToLB(name, pairs){
  const lb = loadLB();
  const entry = { name: name.trim()||'Anonymous', score:pairs, ts:Date.now() };
  lb.push(entry);
  lb.sort((a,b)=>b.score-a.score);
  lb.splice(LB_MAX);
  saveLB(lb);
  return { lb, newIdx: lb.findIndex(e=>e.ts===entry.ts) };
}

function showLeaderboard(lb, newIdx=-1){
  const rows = lb.length ? lb.map((e,i)=>`
    <tr class="${i===newIdx?'highlight':''}">
      <td class="lb-rank">${i+1}</td>
      <td>${e.name}</td>
      <td>${e.score} / ${TOTAL_PAIRS}</td>
    </tr>`).join('') :
    '<tr><td colspan="3" style="opacity:0.5;text-align:center;padding:16px">No scores yet!</td></tr>';
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <h1>🏆 Leaderboard</h1>
    <table class="lb-table">
      <thead><tr><th>#</th><th>Name</th><th style="text-align:right">Pairs</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <button id="playAgainBtn">Play Again</button>
    <button class="lb-btn" id="backBtn">← Back to Menu</button>
  `;
  document.getElementById('playAgainBtn').addEventListener('click', startGame);
  document.getElementById('backBtn').addEventListener('click', showStartScreen);
}

function showNameEntry(won, pairs){
  const reason = won
    ? "You matched everything! The planet thanks you 🌍"
    : lives <= 0
      ? "Three strikes — game over! Give it another go ♻️"
      : "Time's up! Keep practising those memory skills!";
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <h1>${won ? '🎉 You Win!' : '😔 Game Over'}</h1>
    <div id="finalScore">${pairs}/${TOTAL_PAIRS}</div>
    <div id="scoreLabel">pairs matched</div>
    <p>${reason}<br><br>Enter your name for the leaderboard:</p>
    <input id="nameInput" type="text" maxlength="16" placeholder="Your name" />
    <br>
    <button id="submitName">Submit ✓</button>
    <button class="lb-btn" id="skipName">Skip</button>
  `;
  const input = document.getElementById('nameInput');
  const submit = ()=>{ const {lb,newIdx}=addToLB(input.value, pairs); showLeaderboard(lb,newIdx); };
  document.getElementById('submitName').addEventListener('click', submit);
  document.getElementById('skipName').addEventListener('click', ()=>showLeaderboard(loadLB()));
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  setTimeout(()=>input.focus(), 100);
}

function showStartScreen(){
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <h1>🌿 Green Memory</h1>
    <p>Flip cards to find matching pairs.<br>
       One wrong match = one life lost ❤️<br>
       Match all 8 pairs before the minute is up!</p>
    <button id="startBtn">Start Game</button>
    <button class="lb-btn" id="lbBtn">🏆 Leaderboard</button>
  `;
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('lbBtn').addEventListener('click', ()=>showLeaderboard(loadLB()));
}

function endGame(won){
  clearInterval(timerInterval);
  // bgMusic.pause();
  if(won) sfxWin(); else sfxLose();
  setTimeout(()=>showNameEntry(won, matched), 700);
}

function startGame(){
  overlay.classList.add('hidden');
  cards    = buildDeck();
  flipped  = [];
  matched  = 0;
  lives    = MAX_LIVES;
  timeLeft = GAME_DURATION;
  locked   = false;
  renderBoard();
  updateHUD();
  startTimer();
  // bgMusic.play();
}

startBtn.addEventListener('click', startGame);
document.getElementById('lbBtn').addEventListener('click', ()=>showLeaderboard(loadLB()));

})();
</script>
</body>
</html>
